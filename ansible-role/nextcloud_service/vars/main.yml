---
nextcloud_service_url: "https://{{ nextcloud_service_hostname }}"

# occ config:import sets these keys on every run and leaves the rest of config.php alone.
nextcloud_service_config_defaults:
  system:
    trusted_domains: ["{{ nextcloud_service_hostname }}"]
    overwrite.cli.url: "{{ nextcloud_service_url }}"
    overwriteprotocol: https
    maintenance_window_start: 1
    log_type: syslog
    log_type_audit: syslog
    syslog_tag: nextcloud
    syslog_tag_audit: nextcloud
    loglevel: 1
    log.condition: {apps: [admin_audit]}
    preview_max_x: 4096
    preview_max_y: 4096
    preview_max_scale_factor: 1
  apps:
    notify_push:
      base_endpoint: "{{ nextcloud_service_url }}/push"

nextcloud_service_memory_defaults:
  app: 2G
  cron: 2G
  preview: 2G
  recognize: 2G
  db: 768M
  redis: 128M
  push: 128M
  web: 128M

quadlet_service_required:
  service_port: '^[0-9]+$'
  nextcloud_service_hostname: '^[A-Za-z0-9.-]+$'
  nextcloud_service_db_password:
  nextcloud_service_admin_password:
quadlet_service_secrets:
  nextcloud_service_db_password: "{{ nextcloud_service_db_password }}"
  nextcloud_service_admin_password: "{{ nextcloud_service_admin_password }}"
quadlet_service_memory: "{{ nextcloud_service_memory_defaults | combine(nextcloud_service_memory) }}"

nextcloud_service_occ: podman exec -u www-data nextcloud-app php /var/www/html/occ
