---
# Nextcloud service deployment — fully self-contained
# Receives: service_name, service_user, service_home, service_repo

# OCI repository names must be lowercase; podman only reports this at pull
# time, which shows up as an endless container restart loop.
- name: Assert the Nextcloud image reference is lowercase
  ansible.builtin.assert:
    that: nextcloud_service_app_image.split(':')[0] == nextcloud_service_app_image.split(':')[0] | lower
    fail_msg: >-
      nextcloud_service_app_image repository must be lowercase, got
      '{{ nextcloud_service_app_image }}'. Fix nextcloud_image in secrets/vars.yml.

# group matters as much as owner: a directory left in group root is unmapped
# inside the rootless user namespace, so `podman unshare chown` on it fails
# with EPERM and the app container cannot take ownership of its data dir.
- name: Ensure service directories exist
  ansible.builtin.file:
    path: "{{ service_home }}/{{ item }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0755'
  loop:
    - data/db_data
    - data/data
    - data/config
    - data/custom_apps
    - bin
    - .config/containers/systemd/configs

# The image entrypoint rsyncs into /var/www/html and chowns the data and
# config mount points to www-data (uid 33). That chown fails unless the host
# directory already belongs to the subuid uid 33 maps to, and rsync then exits
# 23 in a restart loop. podman unshare does the mapping arithmetic for us.
- name: Own the Nextcloud data and config dirs as the container www-data user
  ansible.builtin.command:
    cmd: >-
      systemd-run --machine={{ service_user }}@ --user --wait --pipe --collect
      --quiet podman unshare chown 33:33 {{ service_home }}/data/{{ item }}
  loop:
    - data
    - config
    - custom_apps
  changed_when: false

# Podman secrets rather than environment variables: the values are then absent
# from `podman inspect` and from /proc/<pid>/environ. Both images accept the
# *_FILE convention. no_log so the value never reaches the Ansible output.
- name: Create podman secrets for the Nextcloud passwords
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      printf '%s' '{{ item.value }}' |
      systemd-run --machine={{ service_user }}@ --user --wait --pipe --collect
      --quiet podman secret create --replace {{ item.name }} -
  loop:
    - {name: nextcloud_db_password, value: "{{ nextcloud_db_password }}"}
    - {name: nextcloud_admin_password, value: "{{ nextcloud_admin_password }}"}
  changed_when: true
  no_log: true
  # podman secret create --replace does not restart consumers, so without this
  # a rotated password updates the secret and leaves the pod on the old one.
  notify: nextcloud quadlets changed

- name: Deploy pre-snapshot pg_dumpall script
  ansible.builtin.template:
    src: pre-snapshot-pg-dump.sh.j2
    dest: "{{ service_home }}/bin/pre-snapshot-pg-dump.sh"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0755'

- name: Template pg_dumpall systemd service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    mode: '0644'
  loop:
    - pg-dumpall.service
    - pg-dumpall.timer

- name: Enable and start pg_dumpall timer
  ansible.builtin.systemd:
    name: pg-dumpall.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Deploy static Quadlet files
  ansible.builtin.copy:
    src: "{{ service_repo }}/quadlets/nc.pod"
    dest: "{{ service_home }}/.config/containers/systemd/"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'
  notify: nextcloud quadlets changed

- name: Template container Quadlets
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ service_home }}/.config/containers/systemd/{{ item | basename | replace('.j2', '') }}"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'
  loop: "{{ query('fileglob', service_repo ~ '/quadlets/*.container.j2') }}"
  notify: nextcloud quadlets changed

- name: Deploy config files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ service_home }}/.config/containers/systemd/configs/{{ item.dest }}"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: "{{ service_repo }}/quadlets/configs/nginx.conf.j2", dest: nginx.conf, mode: '0644' }
    - { src: nextcloud.env.j2, dest: nextcloud.env, mode: '0600' }
  notify: nextcloud quadlets changed

- name: Apply quadlet changes now
  ansible.builtin.meta: flush_handlers

- name: Ensure nextcloud pod is running
  ansible.builtin.command: systemctl --user -M nextcloud@ start nc-pod.service  # noqa: command-instead-of-module
  changed_when: false

# The image applies NEXTCLOUD_TRUSTED_DOMAINS only inside its first-run install
# branch, so a domain added later never reaches config.php and every proxied
# request fails with "Trusted domain error". Enforce it here instead, where it
# is declarative and idempotent.
- name: Wait for Nextcloud to finish installing
  ansible.builtin.command: >-
    systemd-run --machine={{ service_user }}@ --user --wait --pipe --collect --quiet
    podman exec -u www-data nextcloud-app php /var/www/html/occ status --output=json
  register: nextcloud_status
  until: '"\"installed\":true" in nextcloud_status.stdout'
  # 5 minutes: long enough for a cold image pull and the install wizard, short
  # enough that a dead container or an unreachable host fails fast instead of
  # sitting silent for ten.
  retries: 30
  delay: 10
  changed_when: false
  failed_when:
    - nextcloud_status.attempts | default(0) >= 30
    - '"\"installed\":true" not in nextcloud_status.stdout'

- name: Ensure the configured domains are trusted
  ansible.builtin.command: >-
    systemd-run --machine={{ service_user }}@ --user --wait --pipe --collect --quiet
    podman exec -u www-data nextcloud-app php /var/www/html/occ
    config:system:set trusted_domains {{ idx + 1 }} --value={{ item | trim }}
  loop: "{{ nextcloud_trusted_domains.split(',') }}"
  loop_control:
    index_var: idx
  changed_when: true
