---
- name: Assert the Nextcloud image reference is lowercase
  ansible.builtin.assert:
    that: nextcloud_service_app_image.split(':')[0] == nextcloud_service_app_image.split(':')[0] | lower
    fail_msg: >-
      nextcloud_service_app_image repository must be lowercase, got
      '{{ nextcloud_service_app_image }}'. Fix nextcloud_service_app_image in secrets/vars.yml.

# Created once, owned by the service user so that the `podman unshare chown`
# below can take them over. Enforcing the owner on every run would undo that
# chown and report a change forever, so only missing directories are created.
# group, not only owner: a dir left in group root is unmapped in the userns.
- name: Check which service directories exist
  ansible.builtin.stat:
    path: "{{ service_home }}/{{ item }}"
  loop:
    - data/db_data
    - data/data
    - data/config
    - data/custom_apps
    - bin
    - .config/containers/systemd/configs
  register: nextcloud_service_dirs

- name: Create the missing service directories
  ansible.builtin.file:
    path: "{{ service_home }}/{{ item.item }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0755'
  loop: "{{ nextcloud_service_dirs.results | rejectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"

# The image entrypoint chowns these to uid 33 and exits 23 if it cannot.
- name: Own the Nextcloud data and config dirs as the container www-data user
  ansible.builtin.command:
    cmd: >-
      systemd-run --machine={{ service_user }}@ --user --wait --pipe --collect
      --quiet podman unshare chown 33:33 {{ service_home }}/data/{{ item }}
  loop:
    - data
    - config
    - custom_apps
  changed_when: false

# Read first, write on difference: --replace every run restarts the pod.
- name: Read the current podman secrets
  ansible.builtin.command:
    cmd: >-
      systemd-run --machine={{ service_user }}@ --user --wait --pipe --collect
      --quiet podman secret inspect --showsecret --format {{ '{{.SecretData}}' }}
      {{ item.name }}
  loop: "{{ nextcloud_service_secrets }}"
  loop_control:
    label: "{{ item.name }}"
  register: nextcloud_secret_current
  changed_when: false
  failed_when: false
  no_log: true

- name: Write the podman secrets that changed
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      printf '%s' '{{ item.item.value }}' |
      systemd-run --machine={{ service_user }}@ --user --wait --pipe --collect
      --quiet podman secret create --replace {{ item.item.name }} -
  loop: "{{ nextcloud_secret_current.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stdout | default('') != item.item.value
  changed_when: true
  no_log: true
  # --replace does not restart consumers, so a rotated password needs this.
  notify: nextcloud quadlets changed

- name: Deploy pre-snapshot pg_dumpall script
  ansible.builtin.template:
    src: pre-snapshot-pg-dump.sh.j2
    dest: "{{ service_home }}/bin/pre-snapshot-pg-dump.sh"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0755'

- name: Template pg_dumpall systemd service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    mode: '0644'
  loop:
    - pg-dumpall.service
    - pg-dumpall.timer

- name: Enable and start pg_dumpall timer
  ansible.builtin.systemd:
    name: pg-dumpall.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Deploy static Quadlet files
  ansible.builtin.copy:
    src: "{{ service_repo }}/quadlets/nc.pod"
    dest: "{{ service_home }}/.config/containers/systemd/"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'
  notify: nextcloud quadlets changed

- name: Template container Quadlets
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ service_home }}/.config/containers/systemd/{{ item | basename | replace('.j2', '') }}"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'
  loop: "{{ query('fileglob', service_repo ~ '/quadlets/*.container.j2') }}"
  notify: nextcloud quadlets changed

- name: Deploy config files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ service_home }}/.config/containers/systemd/configs/{{ item.dest }}"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: "{{ service_repo }}/quadlets/configs/nginx.conf.j2", dest: nginx.conf, mode: '0644' }
    - { src: nextcloud.env.j2, dest: nextcloud.env, mode: '0600' }
  notify: nextcloud quadlets changed

- name: Apply quadlet changes now
  ansible.builtin.meta: flush_handlers

- name: Ensure nextcloud pod is running
  ansible.builtin.command: systemctl --user -M nextcloud@ start nc-pod.service  # noqa: command-instead-of-module
  changed_when: false

- name: Wait for Nextcloud to finish installing
  ansible.builtin.command: >-
    systemd-run --machine={{ service_user }}@ --user --wait --pipe --collect --quiet
    podman exec -u www-data nextcloud-app php /var/www/html/occ status --output=json
  register: nextcloud_status
  until: '"\"installed\":true" in nextcloud_status.stdout'
  retries: 30
  delay: 10
  changed_when: false
  failed_when:
    - nextcloud_status.attempts | default(0) >= 30
    - '"\"installed\":true" not in nextcloud_status.stdout'

# The image honors NEXTCLOUD_TRUSTED_DOMAINS on first install only.
- name: Ensure the configured domains are trusted
  ansible.builtin.command: >-
    systemd-run --machine={{ service_user }}@ --user --wait --pipe --collect --quiet
    podman exec -u www-data nextcloud-app php /var/www/html/occ
    config:system:set trusted_domains {{ idx + 1 }} --value={{ item | trim }}
  loop: "{{ nextcloud_service_trusted_domains.split(',') }}"
  loop_control:
    index_var: idx
  changed_when: false  # occ cannot report whether the value already matched
