---
- name: Prepare the service home as the service user
  become: true
  become_user: "{{ service_name }}"
  block:
    # An existing data or config dir belongs to a subuid the user cannot chmod.
    - name: Check which service directories exist
      ansible.builtin.stat:
        path: "{{ service_home }}/{{ item }}"
      loop:
        - data/db_data
        - data/data
        - data/config
        - bin
      register: nextcloud_service_dirs

    - name: Create the missing service directories
      ansible.builtin.file:
        path: "{{ service_home }}/{{ item.item }}"
        state: directory
        mode: '0755'
      loop: "{{ nextcloud_service_dirs.results | rejectattr('stat.exists') | list }}"
      loop_control:
        label: "{{ item.item }}"

    # nginx traverses it. After the chown below the user can no longer chmod it.
    - name: Create custom_apps as a traversable nested Btrfs subvolume
      ansible.builtin.shell:
        cmd: btrfs subvolume create {{ service_home }}/data/custom_apps && chmod 0755 {{ service_home }}/data/custom_apps
        creates: "{{ service_home }}/data/custom_apps"

    - name: Own the Nextcloud data and config dirs as the container www-data user
      ansible.builtin.command:
        cmd: podman unshare chown 33:33 {{ service_home }}/data/{{ item }}
      loop:
        - data
        - config
        - custom_apps
      changed_when: false

    - name: Deploy pre-snapshot pg_dumpall script
      ansible.builtin.template:
        src: pre-snapshot-pg-dump.sh.j2
        dest: "{{ service_home }}/bin/pre-snapshot-pg-dump.sh"
        mode: '0755'

- name: Make room for the snapshot drop-in
  ansible.builtin.file:
    path: /etc/systemd/system/btrfs-snapshot@{{ service_name }}.service.d
    state: directory
    owner: root
    mode: '0755'

- name: Snapshot the data only after the dump
  ansible.builtin.copy:
    dest: /etc/systemd/system/btrfs-snapshot@{{ service_name }}.service.d/after-dump.conf
    content: |
      [Unit]
      Wants={{ service_name }}-pg-dumpall.service
      After={{ service_name }}-pg-dumpall.service
    owner: root
    mode: '0644'
  notify: Reload systemd

- name: Template the pg_dumpall service
  ansible.builtin.template:
    src: pg-dumpall.service.j2
    dest: /etc/systemd/system/{{ service_name }}-pg-dumpall.service
    owner: root
    mode: '0644'
  notify: Reload systemd

# The deploy time stands in for the first success, so a job that never
# succeeds alerts 30 h after the deploy.
- name: Seed the dump freshness metric
  ansible.builtin.copy:
    dest: "{{ base_setup_textfile_dir }}/dump-{{ service_name }}.prom"
    content: |
      dump_last_success_timestamp_seconds{service="{{ service_name }}"} {{ ansible_facts.date_time.epoch }}
    owner: root
    mode: '0644'
    setype: container_ro_file_t
    force: false

- name: Deploy the Quadlets
  ansible.builtin.import_role:
    name: quadlet_service

- name: Configure Nextcloud as the service user
  become: true
  become_user: "{{ service_name }}"
  block:
    # Notify=healthy makes the unit active only once php-fpm listens, which is
    # after the entrypoint's install or upgrade. The wait, 180 × 10 s, matches
    # the app unit's TimeoutStartSec.
    - name: Wait for the app container to become healthy
      ansible.builtin.systemd_service:
        name: nextcloud-app.service
        scope: user
      register: nextcloud_service_app_state
      until: nextcloud_service_app_state.status.ActiveState == "active"
      retries: 180
      delay: 10

    - name: Check that Nextcloud is installed and needs no upgrade
      ansible.builtin.command: >-
        {{ nextcloud_service_occ }} status --output=json
      register: nextcloud_service_status
      failed_when: >-
        nextcloud_service_status.rc != 0
        or not (nextcloud_service_status.stdout | from_json).installed
        or (nextcloud_service_status.stdout | from_json).needsDbUpgrade
      changed_when: false

    - name: Read which apps are enabled
      ansible.builtin.command:
        cmd: "{{ nextcloud_service_occ }} app:list --output=json"
      register: nextcloud_service_app_list
      changed_when: false

    - name: Enable the apps the deployment needs
      ansible.builtin.command:
        cmd: "{{ nextcloud_service_occ }} app:enable {{ item }}"
      loop: "{{ nextcloud_service_apps }}"
      when: item not in (nextcloud_service_app_list.stdout | from_json).enabled
      changed_when: true

    - name: Apply the merged config.php settings
      ansible.builtin.command:
        cmd: "{{ nextcloud_service_occ }} config:import"
        stdin: "{{ nextcloud_service_config_defaults | combine(nextcloud_service_config, recursive=true) | to_json }}"
      changed_when: false
