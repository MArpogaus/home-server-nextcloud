---
- name: Assert the Nextcloud passwords are set
  ansible.builtin.assert:
    that:
      - nextcloud_service_db_password | length > 0
      - nextcloud_service_admin_password | length > 0
    fail_msg: >-
      Set nextcloud_service_db_password and nextcloud_service_admin_password in
      secrets/vars.<name>.yml. Nextcloud installs with empty passwords without complaint.
    quiet: true

# An existing data or config dir belongs to a subuid Ansible cannot write through.
- name: Check which service directories exist
  ansible.builtin.stat:
    path: "{{ service_home }}/{{ item }}"
  loop:
    - data/db_data
    - data/data
    - data/config
    - bin
  register: nextcloud_service_dirs

- name: Create the missing service directories
  ansible.builtin.file:
    path: "{{ service_home }}/{{ item.item }}"
    state: directory
    owner: "{{ service_name }}"
    group: "{{ service_name }}"
    mode: '0755'
  loop: "{{ nextcloud_service_dirs.results | rejectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"

- name: Create custom_apps as a nested Btrfs subvolume
  ansible.builtin.shell:
    cmd: >-
      btrfs subvolume create {{ service_home }}/data/custom_apps &&
      chown {{ service_name }}:{{ service_name }} {{ service_home }}/data/custom_apps
    creates: "{{ service_home }}/data/custom_apps"

- name: Keep custom_apps traversable
  ansible.builtin.file:
    path: "{{ service_home }}/data/custom_apps"
    mode: '0755'

- name: Prepare the directories and secrets as the service user
  become: true
  become_user: "{{ service_name }}"
  block:
    - name: Own the Nextcloud data and config dirs as the container www-data user
      ansible.builtin.command:
        cmd: podman unshare chown 33:33 {{ service_home }}/data/{{ item }}
      loop:
        - data
        - config
        - custom_apps
      changed_when: false

    - name: Create the podman secrets
      ansible.builtin.command:
        cmd: podman secret create {{ item.name }} -
        stdin: "{{ item.value }}"
        stdin_add_newline: false
      loop: "{{ nextcloud_service_secrets }}"
      loop_control:
        label: "{{ item.name }}"
      register: nextcloud_service_secret_create
      changed_when: nextcloud_service_secret_create.rc == 0
      failed_when: nextcloud_service_secret_create.rc != 0 and 'in use' not in nextcloud_service_secret_create.stderr
      no_log: true

- name: Deploy pre-snapshot pg_dumpall script
  ansible.builtin.template:
    src: pre-snapshot-pg-dump.sh.j2
    dest: "{{ service_home }}/bin/pre-snapshot-pg-dump.sh"
    owner: "{{ service_name }}"
    group: "{{ service_name }}"
    mode: '0755'

- name: Make room for the snapshot drop-in
  ansible.builtin.file:
    path: /etc/systemd/system/btrfs-snapshot@{{ service_name }}.service.d
    state: directory
    owner: root
    mode: '0755'

- name: Snapshot the data only after the dump
  ansible.builtin.copy:
    dest: /etc/systemd/system/btrfs-snapshot@{{ service_name }}.service.d/after-dump.conf
    content: |
      [Unit]
      Wants={{ service_name }}-pg-dumpall.service
      After={{ service_name }}-pg-dumpall.service
    owner: root
    mode: '0644'
  notify: Reload systemd

- name: Template the pg_dumpall service
  ansible.builtin.template:
    src: pg-dumpall.service.j2
    dest: /etc/systemd/system/{{ service_name }}-pg-dumpall.service
    owner: root
    mode: '0644'
  notify: Reload systemd

# The deploy time stands in for the first dump, so a dump that never succeeds
# alerts 30 h after the deploy.
- name: Seed the dump freshness metric
  ansible.builtin.copy:
    dest: /var/lib/node-textfile/dump-{{ service_name }}.prom
    content: |
      dump_last_success_timestamp_seconds{service="{{ service_name }}"} {{ ansible_facts.date_time.epoch }}
    owner: root
    mode: '0644'
    setype: container_ro_file_t
    force: false

- name: Deploy the Quadlets
  ansible.builtin.import_role:
    name: quadlet_service

- name: Configure Nextcloud as the service user
  become: true
  become_user: "{{ service_name }}"
  block:
    - name: Wait for Nextcloud to finish installing
      ansible.builtin.command: >-
        {{ nextcloud_service_occ }} status --output=json
      register: nextcloud_service_status
      until: '"\"installed\":true" in nextcloud_service_status.stdout'
      # As long as the app unit's TimeoutStartSec, which a major upgrade needs.
      retries: 180
      delay: 10
      changed_when: false

    # The image applies NEXTCLOUD_TRUSTED_DOMAINS on first install only.
    - name: Read which apps are enabled
      ansible.builtin.command:
        cmd: "{{ nextcloud_service_occ }} app:list --output=json"
      register: nextcloud_service_app_list
      changed_when: false

    - name: Enable the apps the deployment needs
      ansible.builtin.command:
        cmd: "{{ nextcloud_service_occ }} app:enable {{ item }}"
      loop: "{{ nextcloud_service_apps }}"
      when: item not in (nextcloud_service_app_list.stdout | from_json).enabled
      changed_when: true

    - name: Apply the settings the role owns
      ansible.builtin.command:
        cmd: podman exec -i -u www-data nextcloud-app php /var/www/html/occ config:import
        stdin: "{{ nextcloud_service_config | to_json }}"
      changed_when: false
