---
- name: Assert the Nextcloud image reference is lowercase
  ansible.builtin.assert:
    that: nextcloud_service_app_image.split(':')[0] == nextcloud_service_app_image.split(':')[0] | lower
    fail_msg: >-
      nextcloud_service_app_image repository must be lowercase, got
      '{{ nextcloud_service_app_image }}'. Fix nextcloud_service_app_image in secrets/vars.yml.

# Only missing directories: enforcing the owner every run would undo the
# `podman unshare chown` below.
- name: Check which service directories exist
  ansible.builtin.stat:
    path: "{{ service_home }}/{{ item }}"
  loop:
    - data/db_data
    - data/data
    - data/config
    - bin
  register: nextcloud_service_dirs

- name: Create the missing service directories
  ansible.builtin.file:
    path: "{{ service_home }}/{{ item.item }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0755'
  loop: "{{ nextcloud_service_dirs.results | rejectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"

# Nested subvolume: snapshots do not recurse into it. btrfs creates it
# root-owned, outside the userns map, so hand it to the service user here.
- name: Create custom_apps as a nested Btrfs subvolume
  ansible.builtin.shell:
    cmd: >-
      btrfs subvolume create {{ service_home }}/data/custom_apps &&
      chown {{ service_user }}:{{ service_user }} {{ service_home }}/data/custom_apps
    creates: "{{ service_home }}/data/custom_apps"

# nginx in nextcloud-web runs as its own uid and has to traverse the directory.
- name: Keep custom_apps traversable
  ansible.builtin.file:
    path: "{{ service_home }}/data/custom_apps"
    mode: '0755'

# The image entrypoint chowns these to uid 33 and exits 23 if it cannot.
- name: Own the Nextcloud data and config dirs as the container www-data user
  ansible.builtin.command:
    cmd: podman unshare chown 33:33 {{ service_home }}/data/{{ item }}
  become: true
  become_user: "{{ service_user }}"
  loop:
    - data
    - config
    - custom_apps
  changed_when: false

# Read first, write on difference: --replace every run restarts the pod.
- name: Read the current podman secrets
  ansible.builtin.command:
    cmd: >-
      podman secret inspect --showsecret --format {{ '{{.SecretData}}' }}
      {{ item.name }}
  become: true
  become_user: "{{ service_user }}"
  loop: "{{ nextcloud_service_secrets }}"
  loop_control:
    label: "{{ item.name }}"
  register: nextcloud_secret_current
  changed_when: false
  failed_when: false
  no_log: true

- name: Write the podman secrets that changed
  ansible.builtin.command:
    cmd: podman secret create --replace {{ item.item.name }} -
    stdin: "{{ item.item.value }}"
    stdin_add_newline: false
  become: true
  become_user: "{{ service_user }}"
  loop: "{{ nextcloud_secret_current.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stdout | default('') != item.item.value
  changed_when: true
  no_log: true
  register: nextcloud_secrets_written

# The image copies its config drop-ins only when the Nextcloud version changes,
# and a drop-in overrides config.php, so occ cannot change these values.
- name: Route the Nextcloud log to syslog
  ansible.builtin.template:
    src: log.config.php.j2
    dest: "{{ service_home }}/data/config/log.config.php"
    mode: '0644'

- name: Hand the log drop-in to the container www-data user
  ansible.builtin.command:
    cmd: podman unshare chown 33:33 {{ service_home }}/data/config/log.config.php
  become: true
  become_user: "{{ service_user }}"
  changed_when: false

- name: Deploy pre-snapshot pg_dumpall script
  ansible.builtin.template:
    src: pre-snapshot-pg-dump.sh.j2
    dest: "{{ service_home }}/bin/pre-snapshot-pg-dump.sh"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0755'

- name: Deploy the job reservation cleanup script
  ansible.builtin.template:
    src: unstick-jobs.sh.j2
    dest: "{{ service_home }}/bin/unstick-jobs.sh"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0755'

# Both timers are Persistent: after downtime they start together at boot.
- name: Make room for the snapshot drop-in
  ansible.builtin.file:
    path: /etc/systemd/system/btrfs-snapshot@{{ service_name }}.service.d
    state: directory
    owner: root
    mode: '0755'

- name: Snapshot the data only after the dump
  ansible.builtin.copy:
    dest: /etc/systemd/system/btrfs-snapshot@{{ service_name }}.service.d/after-dump.conf
    content: |
      [Unit]
      After=pg-dumpall.service
    owner: root
    mode: '0644'

- name: Template the pg_dumpall and unstick-jobs services and timers
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    mode: '0644'
  loop:
    - pg-dumpall.service
    - pg-dumpall.timer
    - unstick-jobs.service
    - unstick-jobs.timer

- name: Enable and start the pg_dumpall and unstick-jobs timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - pg-dumpall.timer
    - unstick-jobs.timer

- name: Deploy the Quadlets
  ansible.builtin.import_role:
    name: quadlet_service
  vars:
    quadlet_service_restart: "{{ nextcloud_secrets_written is changed }}"

- name: Wait for Nextcloud to finish installing
  ansible.builtin.command: >-
    podman exec -u www-data nextcloud-app php /var/www/html/occ status --output=json
  become: true
  become_user: "{{ service_user }}"
  register: nextcloud_status
  until: '"\"installed\":true" in nextcloud_status.stdout'
  retries: 30
  delay: 10
  changed_when: false
  failed_when:
    - nextcloud_status.attempts | default(0) >= 30
    - '"\"installed\":true" not in nextcloud_status.stdout'

# The image honors NEXTCLOUD_TRUSTED_DOMAINS on first install only.
- name: Ensure the configured domains are trusted
  ansible.builtin.command: >-
    podman exec -u www-data nextcloud-app php /var/www/html/occ
    config:system:set trusted_domains {{ idx + 1 }} --value={{ item | trim }}
  become: true
  become_user: "{{ service_user }}"
  loop: "{{ nextcloud_service_trusted_domains.split(',') }}"
  loop_control:
    index_var: idx
  changed_when: false  # occ cannot report whether the value already matched

# Read first, set on difference: occ cannot report whether a value matched.
- name: Read the settings the role owns
  ansible.builtin.command: >-
    podman exec -u www-data nextcloud-app php /var/www/html/occ
    {{ item.cmd }}:get {{ item.key }}
  become: true
  become_user: "{{ service_user }}"
  loop: "{{ nextcloud_service_settings }}"
  loop_control:
    label: "{{ item.key }}"
  register: nextcloud_settings_current
  changed_when: false
  failed_when: false

- name: Set the settings that differ
  ansible.builtin.command: >-
    podman exec -u www-data nextcloud-app php /var/www/html/occ
    {{ item.item.cmd }}:set {{ item.item.key }} --value={{ item.item.value | quote }}
    {{ '--type=integer' if item.item.value is number else '' }}
  become: true
  become_user: "{{ service_user }}"
  loop: "{{ nextcloud_settings_current.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when: item.stdout | trim != item.item.value | string
  changed_when: true
