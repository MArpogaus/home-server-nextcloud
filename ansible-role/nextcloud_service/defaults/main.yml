---

nextcloud_service_app_image: "ghcr.io/marpogaus/nextcloud:35"
nextcloud_service_db_image: "docker.io/library/postgres:18-alpine"
nextcloud_service_redis_image: "docker.io/library/redis:8-alpine"
nextcloud_service_nginx_image: "docker.io/library/nginx:1.31-alpine"

# Required.
nextcloud_service_hostname: ""
nextcloud_service_db_password: ""
nextcloud_service_admin_password: ""

nextcloud_service_admin_user: admin

nextcloud_service_php_max_children: 8
nextcloud_service_php_memory_limit: 512M
nextcloud_service_php_upload_limit: 15G

nextcloud_service_db_dump_retention_days: 30

# The file activity panels read the admin_audit log; the job containers run
# notify_push, previewgenerator and recognize.
nextcloud_service_apps:
  - admin_audit
  - notify_push
  - previewgenerator
  - recognize

# config.php keys (system) and app settings (apps), merged over
# nextcloud_service_config_defaults in vars/main.yml.
nextcloud_service_config: {}
# Memory ceilings per container, merged over nextcloud_service_memory_defaults.
nextcloud_service_memory: {}
