; php-fpm expands ${VAR} from the container environment; php.ini does not.
; Pool sizing therefore lives here, php.ini values as php_admin_value.
[global]
error_log = syslog
syslog.ident = php-fpm
emergency_restart_threshold = ${PHP_EMERGENCY_RESTART_THRESHOLD}
emergency_restart_interval = ${PHP_EMERGENCY_RESTART_INTERVAL}
process_control_timeout = ${PHP_PROCESS_CONTROL_TIMEOUT}

[www]
access.log = /dev/null
pm.max_children = ${PHP_MAX_CHILDREN}
pm.start_servers = ${PHP_START_SERVERS}
pm.min_spare_servers = ${PHP_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_MAX_SPARE_SERVERS}
pm.max_requests = ${PHP_MAX_REQUESTS}
php_admin_value[max_execution_time] = ${PHP_MAX_EXECUTION_TIME}
php_admin_value[max_input_time] = ${PHP_MAX_EXECUTION_TIME}
php_admin_value[max_file_uploads] = ${PHP_MAX_FILE_UPLOADS}
php_admin_flag[allow_url_fopen] = off
php_admin_flag[allow_url_include] = off
php_admin_flag[display_errors] = off
php_admin_flag[expose_php] = off
php_admin_flag[session.use_strict_mode] = on
php_admin_flag[session.cookie_httponly] = on
php_admin_flag[session.cookie_secure] = on
