name: Build Nextcloud Image

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: 0 7 * * *
  workflow_dispatch:

permissions: {}

jobs:
  build:
    strategy:
      # Parallel jobs overwrite each other's `latest` digest between sign and
      # verify, which fails as "no signatures found". Serialised, the last wins.
      max-parallel: 1
      fail-fast: false
      matrix:
        tag: [31, 32, 33, 34]
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    # Pinned to the release commit. Dependabot bumps it when a tag moves.
    uses: MArpogaus/image-builder-action/.github/workflows/reusable-build-and-publish-one-image.yml@7e52129c98111d7437960159061f3ab0b6fa2f33 # v1.6.0
    with:
      image-name: nextcloud
      containerfile: ./containers/Containerfile
      context: ./containers
      platform: linux/amd64
      free-disk-space: false
      overwrite-ref-tag: ${{ matrix.tag }}
      build-args: |
        NEXTCLOUD_TAG=${{ matrix.tag }}
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
