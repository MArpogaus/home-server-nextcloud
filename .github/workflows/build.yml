name: Build Nextcloud Image

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: 0 7 * * *
  workflow_dispatch:

permissions: {}

jobs:
  build:
    strategy:
      # Every matrix job also pushes and then verifies the `latest` tag. Run in
      # parallel and they overwrite each other's digest between sign and
      # verify, which fails as "no signatures found". Serialised, the last
      # entry wins `latest`, which is also the semantics we want.
      max-parallel: 1
      # One version failing should not cancel the others.
      fail-fast: false
      matrix:
        tag: [31, 32, 33, 34]
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    # Upstream directly rather than a vendored copy: the fork had already
    # drifted (different pinned checkout) and had to be synced by hand.
    uses: MArpogaus/image-builder-action/.github/workflows/reusable-build-and-publish-one-image.yml@9060cddfa5998c2bf2e2c6a5df4fa1d6607a075c
    with:
      image-name: nextcloud
      containerfile: ./containers/Containerfile
      context: ./containers
      platform: linux/amd64
      free-disk-space: false
      overwrite-ref-tag: ${{ matrix.tag }}
      build-args: |
        NEXTCLOUD_TAG=${{ matrix.tag }}
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
