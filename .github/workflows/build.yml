name: Build Nextcloud Image

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: 0 7 * * *
  workflow_dispatch:

permissions: {}

# Two runs publishing the same tags would overwrite each other's digest
# between signing and verification.
concurrency:
  group: build-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # The schedule builds only the versions whose base image moved. The digest
  # of the base is a label on every published image.
  changed:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.compare.outputs.tags }}
      latest: ${{ steps.compare.outputs.latest }}
    steps:
      - id: compare
        run: |
          set -euo pipefail
          # The deployed major and the next one; latest is the highest.
          versions="34 35"
          printf 'latest=%s\n' "${versions##* }" >> "$GITHUB_OUTPUT"
          tags=()
          for t in $versions; do
            if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then tags+=("$t"); continue; fi
            base=$(skopeo inspect --format '{{.Digest}}' "docker://docker.io/library/nextcloud:${t}-fpm")
            built=$(skopeo inspect --format '{{index .Labels "org.opencontainers.image.base.digest"}}' \
              "docker://ghcr.io/marpogaus/nextcloud:${t}" 2>/dev/null || echo none)
            [ "$base" = "$built" ] || tags+=("$t")
          done
          # printf applies the format once even for an empty array, which
          # would emit [""] and run the matrix with an empty tag.
          if [ ${#tags[@]} -eq 0 ]; then
            echo 'tags=[]' >> "$GITHUB_OUTPUT"
          else
            printf 'tags=%s\n' "$(printf '%s\n' "${tags[@]}" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changed
    if: needs.changed.outputs.tags != '[]'
    strategy:
      # Parallel jobs overwrite each other's `latest` digest between sign and
      # verify, which fails as "no signatures found". Serialised, the last wins.
      max-parallel: 1
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.changed.outputs.tags) }}
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    # Pinned to a commit. Dependabot bumps it when a tag moves.
    uses: MArpogaus/image-builder-action/.github/workflows/reusable-build-and-publish-one-image.yml@052a039cfdad3f6db40cb8931abd04cd529552f1
    with:
      image-name: nextcloud
      containerfile: ./containers/Containerfile
      context: ./containers
      platform: linux/amd64
      free-disk-space: false
      # dev publishes :<version>-dev for the test VM; the version tag that the
      # real host follows comes from main only.
      overwrite-ref-tag: ${{ matrix.tag }}${{ github.ref_name == 'dev' && '-dev' || '' }}
      latest-tag: ${{ matrix.tag == needs.changed.outputs.latest }}
      build-args: |
        NEXTCLOUD_TAG=${{ matrix.tag }}
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
