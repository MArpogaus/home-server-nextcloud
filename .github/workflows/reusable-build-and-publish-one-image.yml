name: Build and publish a container image

permissions: {}

on:
  workflow_call:
    inputs:
      image-name:
        type: string
        required: true
      containerfile:
        type: string
        required: true
      context:
        type: string
        required: true
      platform:
        type: string
        required: true
      slsa-verify-source:
        type: string
        required: false
        default: ''
      cosign-public-key:
        type: string
        required: false
        default: ''
      build-args:
        type: string
        required: false
        default: ''
      free-disk-space:
        type: boolean
        required: false
        default: true
      overwrite-ref-tag:
        type: string
        required: false
        default: ''
    secrets:
      SIGNING_SECRET:
        required: true

jobs:
  build_and_push_image:
    runs-on: ubuntu-latest
    outputs:
      FULL_IMAGE_REF: ${{ steps.build.outputs.full-image-ref }}
      IMAGE_DIGEST: ${{ steps.build.outputs.image-digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Build and Push Image
        id: build
        uses: MArpogaus/image-builder-action@a8819dcffeebb3c126f5e372711ebe0df484f360 # v1.5.2
        with:
          image-name: ${{ inputs.image-name }}
          containerfile: ${{ inputs.containerfile }}
          context: ${{ inputs.context }}
          platform: ${{ inputs.platform }}
          slsa-verify-source: ${{ inputs.slsa-verify-source }}
          cosign-public-key: ${{ inputs.cosign-public-key }}
          build-args: ${{ inputs.build-args }}
          free-disk-space: ${{ inputs.free-disk-space }}
          overwrite-ref-tag: ${{ inputs.overwrite-ref-tag }}
          signing-secret: ${{ secrets.SIGNING_SECRET }}

  provenance:
    needs: [build_and_push_image]
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      image: ${{ needs.build_and_push_image.outputs.FULL_IMAGE_REF }}
      digest: ${{ needs.build_and_push_image.outputs.IMAGE_DIGEST }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
